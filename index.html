<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Diri Minimalis</title>
    <!-- Google Fonts untuk Tipografi Elegan -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 1. CSS VARIABLES (Untuk Tema Terang & Gelap) --- */
        :root {
            --bg-color: #fcfbf9;       /* Putih hangat / krem minimalis */
            --text-color: #1a1a1a;     /* Hitam arang */
            --accent-color: #4a5d4e;   /* Hijau sage tua (aksen elegan) */
            --card-bg: #ffffff;
            --border-color: #e5e5e5;
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;       /* Hitam pekat */
            --text-color: #f5f5f5;     /* Putih abu-abu */
            --accent-color: #a3b899;   /* Hijau sage muda */
            --card-bg: #1e1e1e;
            --border-color: #2a2a2a;
        }

        /* --- 2. BASE STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: var(--transition);
            overflow-x: hidden;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        section {
            padding: 7rem 0;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        section.appear {
            opacity: 1;
            transform: translateY(0);
        }

        h2 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 3rem;
            letter-spacing: -0.03em;
        }

        /* --- 3. NAVIGATION --- */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(252, 251, 249, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        [data-theme="dark"] nav {
            background-color: rgba(18, 18, 18, 0.8);
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.95rem;
            font-weight: 400;
            opacity: 0.7;
            transition: var(--transition);
        }

        .nav-links a:hover {
            opacity: 1;
            color: var(--accent-color);
        }

        /* Dark Mode Toggle Button */
        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* --- 4. HERO SECTION --- */
        #hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 70px;
        }

        .hero-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4rem;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.04em;
            margin-bottom: 1.5rem;
        }

        .hero-text p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            max-width: 500px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background-color: var(--accent-color);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        [data-theme="dark"] .btn {
            color: #121212;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .hero-image {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        /* Frame foto minimalis abstrak jika belum ada foto */
        .image-placeholder {
            width: 320px;
            height: 400px;
            background-color: var(--border-color);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- 5. PORTFOLIO / PROJECTS --- */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
        }

        .project-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-color);
        }

        .project-img-thumb {
            width: 100%;
            height: 200px;
            background-color: var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-info h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .project-info p {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* --- 6. ABOUT & SKILLS --- */
        .about-wrapper {
            display: flex;
            gap: 4rem;
        }

        .about-bio {
            flex: 2;
            font-size: 1.1rem;
            opacity: 0.85;
        }

        .about-skills {
            flex: 1;
        }

        .skill-list {
            list-style: none;
        }

        .skill-list li {
            font-size: 1rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
        }

        .skill-list li::before {
            content: "→ ";
            color: var(--accent-color);
        }

        /* --- 7. CONTACT & FOOTER --- */
        #contact {
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .contact-email {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: -0.03em;
            margin: 2rem 0;
            display: inline-block;
            transition: var(--transition);
        }

        .contact-email:hover {
            color: var(--accent-color);
        }

        footer {
            padding: 3rem 0;
            text-align: center;
            font-size: 0.85rem;
            opacity: 0.5;
            border-top: 1px solid var(--border-color);
        }

        /* --- 8. POPUP MODAL FOR PROJETS --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .close-modal {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-color);
        }

        /* RESPONSIVE DESIGN (MOBILE) */
        @media (max-width: 768px) {
            .hero-wrapper, .about-wrapper {
                flex-direction: column;
                gap: 2rem;
            }
